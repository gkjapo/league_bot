services:
  db:
    image: postgres:16-alpine
    container_name: league_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  bo7bot:
    build: .
    container_name: bo7bot
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./migrations:/app/migrations  # Mount migrations directory
    restart: unless-stopped
    environment:
      - DB_HOST=db  # Override to use docker service name

volumes:
  pgdata:
