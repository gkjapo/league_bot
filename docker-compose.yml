services:
  db:
    image: postgres:16-alpine
    container_name: league_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  bo7bot:
    build: .
    container_name: bo7bot
    env_file: .env
    depends_on:
      - db
    volumes:
      - ./data:/app/data  # optional: logs, persistent files
    restart: unless-stopped

volumes:
  pgdata:
